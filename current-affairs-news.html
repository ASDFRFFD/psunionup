<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Current Affairs - Panchayat Sahayak Portal</title>
  <meta name="description" content="Stay updated with the latest current affairs and news in a fast, swipeable format.">
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0f766e;
      --accent: #f97316;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --bg-dark: #020617;
      --bg-card: #0f172a;
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-blur: blur(20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body, html {
      height: 100%;
      width: 100%;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text-main);
      overflow: hidden; /* Prevent body scroll */
      overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
    }

    /* TOP NAVIGATION */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(2,6,23,0.9) 0%, rgba(2,6,23,0) 100%);
      z-index: 100;
      pointer-events: none; /* Let clicks pass through except on buttons */
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: auto;
      transition: 0.3s;
    }
    
    .nav-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      pointer-events: auto;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .brand-title span { color: var(--accent); }

    /* NEWS CONTAINER - SNAP SCROLLING */
    #news-container {
      height: 100vh;
      height: 100dvh; /* For mobile browsers with dynamic UI */
      width: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      /* Hide scrollbar */
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #news-container::-webkit-scrollbar { display: none; }

    /* INDIVIDUAL NEWS CARD */
    .news-card {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-card);
    }

    /* IMAGE SECTION (TOP 45%) */
    .news-image {
      height: 45%;
      width: 100%;
      position: relative;
      background-color: #1e293b;
    }
    .news-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to top, var(--bg-card) 0%, rgba(15,23,42,0) 100%);
    }

    /* CONTENT SECTION (BOTTOM 55%) */
    .news-content {
      height: 55%;
      padding: 24px 20px 80px 20px; /* Extra bottom padding for footer */
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .news-meta {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .news-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 16px;
      color: #f8fafc;
    }

    .news-desc {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      font-weight: 400;
      flex-grow: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
    }

    .news-source {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 16px;
      font-weight: 500;
    }
    .news-source a {
      color: #60a5fa;
      text-decoration: none;
    }

    /* BOTTOM ACTION BAR */
    .action-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .swipe-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      animation: pulse 2s infinite;
    }
    .swipe-hint svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @keyframes pulse {
      0% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(-4px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.7; }
    }

    .action-btns {
      display: flex;
      gap: 16px;
    }
    .action-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .action-btn:hover { color: var(--accent); transform: scale(1.1); }
    .action-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* LOADING SPINNER */
    .loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 1000;
    }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    @media (min-width: 768px) {
      body {
        background: #020617;
        background-image: radial-gradient(#1e293b 1px, transparent 1px);
        background-size: 20px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #news-container {
        width: 400px;
        height: 800px;
        max-height: 90vh;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        border: 4px solid #1e293b;
        position: relative;
        overflow-y: scroll;
      }
      .top-nav {
        position: absolute;
        border-radius: 20px 20px 0 0;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="index.html" class="nav-btn" aria-label="Back to Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="brand-title">Panchayat <span>News</span></div>
    <div style="width:40px;"></div> <!-- Spacer -->
  </div>

  <div id="loader" class="loader"></div>

  <!-- News Container (Scroll Snapping) -->
  <div id="news-container">
    <!-- News cards will be injected here by JS -->
  </div>

  <script>
    // Mock Data for Premium Current Affairs
    const newsData = [
      {
        id: 1,
        title: "Digital India Milestone: UPI Transactions Cross Record High in May 2026",
        desc: "India's Unified Payments Interface (UPI) continues its staggering growth, crossing a historic milestone this month. The National Payments Corporation of India (NPCI) reported that rural adoption played a crucial role in the latest surge. This aligns with the government's push for a cash-lite economy, making daily transactions seamless even in remote Gram Panchayats. Experts predict further global integration of the payment system.",
        image: "https://images.unsplash.com/photo-1613243555988-441166d4d6fd?auto=format&fit=crop&q=80&w=800",
        category: "Technology",
        time: "2 hours ago",
        sourceName: "Tech Desk",
        sourceUrl: "#"
      },
      {
        id: 2,
        title: "ISRO Announces Next Generation Satellite Launch to Boost Rural Connectivity",
        desc: "In a massive leap for rural digital infrastructure, ISRO has successfully scheduled the launch of its newest communication satellite. Designed specifically to provide high-speed internet to remote villages, the initiative will heavily benefit the Panchayat Sahayak ecosystem by ensuring uninterrupted connectivity for state portals. The launch will take place from Sriharikota early next week.",
        image: "https://images.unsplash.com/photo-1517976487492-5750f3195933?auto=format&fit=crop&q=80&w=800",
        category: "Science",
        time: "5 hours ago",
        sourceName: "Science Today",
        sourceUrl: "#"
      },
      {
        id: 3,
        title: "New Scheme Announced for Gram Panchayat Development and Digital Empowerment",
        desc: "The Ministry of Panchayati Raj unveiled a comprehensive new development scheme today. Aimed at fully digitizing local governance, the scheme provides extra funding for advanced computing equipment at Panchayat Bhawans. Panchayat Sahayaks are expected to receive specialized training to handle the new centralized software. The rollout will begin in three phases starting next month.",
        image: "https://images.unsplash.com/photo-1577903248316-d18cfd14ccf9?auto=format&fit=crop&q=80&w=800",
        category: "Government",
        time: "1 day ago",
        sourceName: "Gov Alert",
        sourceUrl: "#"
      },
      {
        id: 4,
        title: "Global Summit in New Delhi Highlights India's Grassroots Growth Model",
        desc: "Delegates from over 40 countries praised India's decentralized growth model during the concluding session of the Global Summit in New Delhi today. Special emphasis was given to how technology is empowering local bodies and Panchayat Sahayaks to deliver transparent governance. Several nations expressed interest in adopting a similar digital public infrastructure for their own local governance.",
        image: "https://images.unsplash.com/photo-1588693899661-d602052c93d9?auto=format&fit=crop&q=80&w=800",
        category: "National",
        time: "1 day ago",
        sourceName: "News Wire",
        sourceUrl: "#"
      }
    ];

    const container = document.getElementById('news-container');
    const loader = document.getElementById('loader');

    // Render News Cards
    function renderNews() {
      container.innerHTML = '';
      
      newsData.forEach((news, index) => {
        // SVG Icons
        const shareIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>`;
        const bookmarkIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>`;
        const swipeUpIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>`;

        const card = document.createElement('div');
        card.className = 'news-card';
        
        // Only show "Swipe up for next" if not the last card
        const swipeText = index < newsData.length - 1 ? 
          `<div class="swipe-hint">${swipeUpIcon} Swipe up for next</div>` : 
          `<div class="swipe-hint" style="animation:none; opacity:0.5;">End of feed</div>`;

        card.innerHTML = `
          <div class="news-image">
            <img src="${news.image}" alt="News Image" loading="lazy">
            <div class="image-overlay"></div>
          </div>
          <div class="news-content">
            <div class="news-meta">
              <span>${news.category}</span>
              <span>•</span>
              <span>${news.time}</span>
            </div>
            <h2 class="news-title">${news.title}</h2>
            <p class="news-desc">${news.desc}</p>
            <div class="news-source">
              Short by <strong>Panchayat News</strong> / <a href="${news.sourceUrl}">Read more</a>
            </div>
            
            <div class="action-bar">
              ${swipeText}
              <div class="action-btns">
                <button class="action-btn" aria-label="Share" onclick="shareNews('${news.title}')">${shareIcon}</button>
                <button class="action-btn" aria-label="Bookmark" onclick="toggleBookmark(this)">${bookmarkIcon}</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      
      // Hide loader
      setTimeout(() => {
        loader.style.display = 'none';
      }, 500);
    }

    // Share Functionality (using Web Share API if available)
    function shareNews(title) {
      if (navigator.share) {
        navigator.share({
          title: title,
          text: 'Read this short news on Panchayat Sahayak Portal:',
          url: window.location.href
        }).catch(console.error);
      } else {
        alert("Link copied to clipboard!");
      }
    }

    // Toggle Bookmark
    function toggleBookmark(btn) {
      const isBookmarked = btn.style.color === 'var(--accent)';
      btn.style.color = isBookmarked ? '#cbd5e1' : 'var(--accent)';
      
      // Add a tiny bump animation
      btn.style.transform = 'scale(1.2)';
      setTimeout(() => btn.style.transform = 'scale(1)', 200);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', renderNews);

  </script>
</body>
</html>
